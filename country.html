<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedia - Manage Countries</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/all.css"> <!-- optional -->
</head>
<body>
    <div class="container-fluid mt-3">
        <div id="countrynotifications"></div>

        <table class="table table-sm table-striped table-hover" id="countrytable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Country Name</th>
                    <th>Cities</th>
                    <th>Airports</th>
                    <th>Airlines</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Button for adding a country -->
        <button class="btn btn-sm btn-success mb-3" id="addnewcountry">
            <i class="fas fa-plus"></i> Add New Country
        </button>
    </div>

    <!-- Modal for country details -->
    <div class="modal fade" tabindex="-1" role="dialog" id="countrydetailsmodal">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Country Details</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="notifications"></div>
                    <input type="hidden" name="countryid" id="countryid" value="0">
                    <div class="form-group">
                        <label for="countryname">Country Name</label>
                        <input type="text" name="countryname" id="countryname" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success btn-sm" id="savecountry">
                        <i class="fas fa-save fa-lg"></i> Save changes
                    </button>
                    <button type="button" class="btn btn-outline-danger" data-dismiss="modal">
                        <i class="fas fa-times fa-lg"></i> Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="javascript/jquery-3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <script src="javascript/bootstrap.min.js"></script>
    <script src="javascript/country.js"></script> 
</body>
</html>
